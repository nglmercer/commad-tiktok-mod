# Build-time settings only. Runtime settings live in
# plugins/TikTokMinecraft/config.yml (see docs/CONFIGURATION.md).

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false

group=dev.nglmercer
version=0.1.0

# The TikTok LIVE Java SDK. It is consumed as an external dependency and is
# never vendored into this repository. See docs/DEVELOPMENT.md for how to make
# it resolvable outside of Maven Local.
tiktokSdkVersion=0.1.0-SNAPSHOT
# Optional authoritative Maven repository that publishes the SDK. When set it is
# consulted before Maven Local, so CI and releases never depend on a local
# snapshot. Example:
#   tiktokSdkRepositoryUrl=https://repo.example.org/releases
# tiktokSdkRepositoryUrl=

# GraalJS, used by the SDK's embedded signer.
graalJsVersion=25.3.4.1

# Paper API compiled against. Paper 1.21.11 runs on Java 21.
paperApiVersion=1.21.11-R0.1-SNAPSHOT
