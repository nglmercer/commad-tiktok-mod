# Gift rules.
#
# 'gift' fires for every gift update, 'gift.final' fires once when a gift
# streak is complete. Use 'gift.final' for streak gifts so an action runs
# once per streak instead of once per repetition.
#
# The example matches a gift by name, which is convenient but not stable:
# names are localized and can change. For production, match on the exact gift
# id instead, for example:
#
#   match:
#     gift-id: "5655"

rules:
  - id: rose-zombie
    enabled: false
    trigger: gift.final

    match:
      gift-name: "Rose"

    cooldown:
      duration: 2s
      scope: user

    actions:
      - type: function
        name: gifts:spawn_zombies
        args:
          count: 1
