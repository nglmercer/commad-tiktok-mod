name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  PAPER_VERSION: '1.21.11'

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Compile and test
        run: ./gradlew clean build --stacktrace

      - name: Resolve the GraalJS runtime
        run: ./gradlew :paper-plugin:verifyGraalJs

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: TikTokMinecraft
          path: paper-plugin/build/libs/TikTokMinecraft-*.jar
          if-no-files-found: error

  plugin-jar:
    name: Inspect the plugin JAR
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build
        run: ./gradlew :paper-plugin:assemble

      - name: Verify the JAR
        run: python3 scripts/verify-plugin.py paper-plugin/build/libs/TikTokMinecraft-0.1.0.jar

      - name: Check the third-party notices
        run: |
          set -e
          jar=paper-plugin/build/libs/TikTokMinecraft-0.1.0.jar
          for notice in META-INF/LICENSE.protobuf META-INF/THIRD_PARTY_NOTICES.md THIRD-PARTY-NOTICES.md; do
            if ! unzip -l "$jar" | grep -q "$notice"; then
              echo "The plugin JAR is missing $notice"
              exit 1
            fi
          done
          echo "Every licence notice survived packaging."

  schemas:
    name: Check the examples against the schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the schema tools
        run: pip install --quiet jsonschema pyyaml

      - name: Check the examples
        run: python3 scripts/check-schemas.py

  paper-smoke:
    name: Paper runtime smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build the plugin
        run: ./gradlew :paper-plugin:assemble

      - name: Download Paper
        run: |
          set -e
          mkdir -p test-server/plugins
          build=$(curl -fsSL -H 'User-Agent: tiktokminecraft-ci' \
            "https://fill.papermc.io/v3/projects/paper/versions/${{ env.PAPER_VERSION }}/builds" \
            | python3 -c "import json,sys; builds=json.load(sys.stdin); print([b for b in builds if b['channel']=='STABLE'][0]['downloads']['server:default']['url'])")
          curl -fsSL -o test-server/paper.jar "$build"
          echo "eula=true" > test-server/eula.txt
          cp paper-plugin/build/libs/TikTokMinecraft-*.jar test-server/plugins/

      - name: Start the server and check the plugin
        run: |
          set -e
          cd test-server
          java -jar paper.jar --nogui > console.log 2>&1 &
          server=$!
          for _ in $(seq 1 90); do
            if grep -q 'Done (' console.log 2>/dev/null; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then
              echo "The server stopped during startup:"
              cat console.log
              exit 1
            fi
            sleep 2
          done
          sleep 5
          echo "--- plugin lines ---"
          grep 'TikTokMinecraft' console.log || true
          if ! grep -q 'Enabling TikTokMinecraft' console.log; then
            echo "The plugin did not enable:"
            cat console.log
            kill "$server" || true
            exit 1
          fi
          if grep -qE 'NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError' console.log; then
            echo "A dependency failed to load:"
            grep -E 'NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError' console.log
            kill "$server" || true
            exit 1
          fi
          echo "The plugin enabled and every dependency resolved."
          kill "$server" || true
          wait "$server" 2>/dev/null || true
          cat console.log

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-console
          path: test-server/console.log
          if-no-files-found: warn
