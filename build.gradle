// TikTokMinecraft — a standalone Paper plugin that bridges TikTok LIVE into
// Minecraft. The build has two modules:
//
//   functions-core  the reusable function engine (no Minecraft, no Paper)
//   paper-plugin    the Paper plugin: TikTok connection, rules, actions
//
// There is no Loom, no Fabric and no multi-version matrix: the plugin targets
// one Paper API and ships as a single JAR.

def tiktokSdkVersion = providers.gradleProperty('tiktokSdkVersion').get()
def graalJsVersion = providers.gradleProperty('graalJsVersion').get()
def paperApiVersion = providers.gradleProperty('paperApiVersion').get()

ext {
    tiktokSdkVersion = tiktokSdkVersion
    graalJsVersion = graalJsVersion
    paperApiVersion = paperApiVersion
}

allprojects {
    group = providers.gradleProperty('group').get()
    version = providers.gradleProperty('version').get()

    repositories {
        // An authoritative remote repository for the TikTok SDK, when the
        // project publishes one. It is consulted first so production builds
        // never depend on a developer's Maven Local.
        def sdkRepository = providers.gradleProperty('tiktokSdkRepositoryUrl').getOrNull()
        if (sdkRepository) {
            maven { url = sdkRepository }
        }
        // Development fallback: the SDK publishes snapshots to Maven Local via
        // `sdk/java` in nglmercer/tiktok-signer.
        mavenLocal()
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }
}

tasks.register('printVersions') {
    group = 'help'
    description = 'Prints the configured build versions.'
    doLast {
        println "TikTokMinecraft ${version}"
        println "  Paper API      : ${paperApiVersion}"
        println "  TikTok SDK     : ${tiktokSdkVersion}"
        println "  GraalJS        : ${graalJsVersion}"
    }
}
